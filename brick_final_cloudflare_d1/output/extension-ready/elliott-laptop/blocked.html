<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Blocked</title>
  <style>
    body{font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#111827;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}
    .card{background:white;border:1px solid #e5e7eb;border-radius:24px;padding:28px;max-width:520px;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.1)}
    button{border:0;background:#111827;color:white;border-radius:12px;padding:10px 14px;font-weight:800}
  </style>
</head>
<body>
  <div class="card">
    <h1>Page Blocked</h1>
    <p id="reason">Blocked by classroom policy.</p>
    <button onclick="history.back()">Go Back</button>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const reason = q.get("reason");
    const value = q.get("value");
    document.getElementById("reason").textContent =
      reason === "locked" ? "Browsing is locked." :
      reason === "focus" ? "Focus mode only allows approved sites." :
      reason === "domain" ? "Blocked domain: " + value :
      reason === "keyword" ? "Blocked keyword: " + value :
      "Blocked by classroom policy.";
  </script>
</body>
</html>
